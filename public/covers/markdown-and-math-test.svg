      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#2b2b30"/>
    </linearGradient>
    <pattern id="grid-md" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade-md" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .cjk { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-md)"/>
  <rect width="1200" height="750" fill="url(#grid-md)"/>

  <text x="120" y="300" fill="url(#fade-md)" class="mono" font-size="200" font-weight="700">
    #
  </text>
  <g fill="url(#fade-md)" font-family="Cambria, Georgia, serif" font-size="150" text-anchor="middle">
    <text x="520" y="290">&#8721;</text>
    <text x="760" y="300">&#8747;</text>
    <text x="990" y="290">&#8730;</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" fill="none">
    <path d="M120 360h960"/>
  </g>
  <text x="120" y="415" fill="#ffffff" fill-opacity="0.5" class="mono" font-size="30">
    **bold** &#160; _italic_ &#160; `code` &#160; E = mc&#178;
  </text>

  <text x="120" y="610" class="cjk" fill="#ffffff" font-size="54" font-weight="600">
    Markdown 语法与
  </text>
  <text x="120" y="672" class="cjk" fill="#ffffff" font-size="54" font-weight="600">
    数学公式测试
  </text>
  <text x="120" y="716" class="cjk" fill="#ffffff" fill-opacity="0.45" font-size="22" letter-spacing="6">

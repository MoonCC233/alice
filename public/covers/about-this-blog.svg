<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="关于这个博客">
  <defs>
    <linearGradient id="bg-about" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#2b2b30"/>
    </linearGradient>
    <pattern id="grid-about" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .cjk { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-about)"/>
  <rect width="1200" height="750" fill="url(#grid-about)"/>

  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- roof -->
    <path d="M420 300l180-130 180 130"/>
    <!-- body -->
    <path d="M470 300v190h260V300"/>
    <!-- door -->
    <path d="M565 490V380h70v110"/>
    <!-- window -->
    <rect x="490" y="330" width="50" height="50" rx="4"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M120 560h960"/>
  </g>
  <text x="120" y="620" class="cjk" fill="#ffffff" font-size="54" font-weight="600">
    关于这个博客
  </text>
  <text x="120" y="668" class="cjk" fill="#ffffff" fill-opacity="0.45" font-size="24" letter-spacing="6">
    起源 &#183; 模板 &#183; 改造
  </text>
</svg>
